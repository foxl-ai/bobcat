[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bobcat-decisions"
version = "0.1.0"
description = "Korean-first typed decision models with auditable training and evaluation."
requires-python = ">=3.12,<3.15"
dependencies = [
  "torch==2.13.0",
  "safetensors>=0.5,<1",
  "numpy>=2,<3",
  "tokenizers>=0.21,<0.24",
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
aws = ["boto3>=1.40,<2"]
corpus = ["huggingface-hub>=1,<2", "pyarrow>=20,<30"]
serve = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "jinja2>=3.1.6,<4",
]

[project.scripts]
bobcat = "bobcat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bobcat"]

[tool.uv]
# setuptools is a transitive dependency (torch); < 83 has a moderate advisory.
constraint-dependencies = ["setuptools>=83"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Long lines kept as written: the Flash corpus manifest records this generator's SHA-256.
"src/bobcat/flash_families.py" = ["E501"]
